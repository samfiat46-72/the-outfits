<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product | The Outfits</title>

<style>
/* PDP Page */
.pdp-container {
  padding: 1rem;
}

.pdp-image {
  width: 100%;
  border-radius: 16px;
}

.pdp-title {
  font-size: 22px;
  font-weight: 700;
  margin-top: 12px;
}

.pdp-price {
  font-size: 20px;
  font-weight: 700;
  color: #c5a04f;
  margin-top: 6px;
}

.pdp-desc {
  margin: 10px 0;
  color: #555;
  font-size: 15px;
}

.pdp-btn {
  width: 100%;
  background: #c5a04f;
  color: #000;
  padding: 14px;
  border-radius: 12px;
  font-size: 18px;
  font-weight: 600;
  border: none;
  margin-top: 20px;
}
</style>

</head>

<body>

<div class="pdp-container">
  <img class="pdp-image" src="" id="pdp-img">

  <h1 class="pdp-title" id="pdp-title"></h1>
  <p class="pdp-price" id="pdp-price"></p>

  <p class="pdp-desc">
    Premium quality fabric designed for comfort and style.
  </p>

  <button class="pdp-btn">Buy Now</button>
</div>

<script>
const url = new URLSearchParams(window.location.search);

document.getElementById("pdp-img").src = url.get("img");
document.getElementById("pdp-title").innerText = url.get("name");
document.getElementById("pdp-price").innerText = "₹" + url.get("price");
</script>

</body>
</html>
