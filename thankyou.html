  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #faf4ec;
      color: #2b2b2b;
      text-align: center;
      padding: 60px 20px;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      border-bottom: 1px solid #f2f2f2;
      padding: 12px 20px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .navbar .logo a {
      font-family: "Poppins", sans-serif;
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
      color: #000;
    }
    .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }
    .nav-links li a {
      text-decoration: none;
      color: #000;
      font-size: 16px;
      font-weight: 500;
      position: relative;
      transition: color 0.3s ease;
    }
    .nav-links li a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      left: 0;
      bottom: -4px;
      background: #c5a04f; /* gold hover */
      transition: width 0.3s ease;
      border-radius: 2px;
    }
    .nav-links li a:hover::after,
    .nav-links li a.active::after {
      width: 100%;
    }
    .nav-links li a:hover {
      color: #c5a04f;
    }
    @media (max-width: 600px) {
      .navbar {
        flex-direction: column;
        align-items: flex-start;
        padding: 15px;
      }
      .nav-links {
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
        width: 100%;
        margin-top: 10px;
      }
      .navbar .logo {
        margin-bottom: 5px;
      }
    }
  </style>
</head>
