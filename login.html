<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | The Outfits</title>

<style>
.login-box {
  max-width: 360px;
  margin: 60px auto;
  padding: 20px;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 5px 14px rgba(0,0,0,0.08);
}

.login-box h2 {
  text-align: center;
  margin-bottom: 20px;
  font-size: 24px;
}

.input-box {
  margin-bottom: 15px;
}

.input-box input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #ccc;
  font-size: 16px;
}

.login-btn {
  width: 100%;
  padding: 12px;
  background: #c5a04f;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: 600;
  color: #000;
  margin-top: 10px;
}
</style>

</head>

<body>

<div class="login-box">
  <h2>Login</h2>

  <div class="input-box">
    <input type="text" placeholder="Phone Number">
  </div>

  <div class="input-box">
    <input type="password" placeholder="Password">
  </div>

  <button class="login-btn">Login</button>
</div>

</body>
</html>
