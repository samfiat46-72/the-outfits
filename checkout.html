<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — The Outfits</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8f1e9;
      text-align: center;
      padding: 40px;
    }
    .checkout-box {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: auto;
    }
    img {
      width: 150px;
      margin-bottom: 20px;
    }
    h2 {
      color: #222;
    }
    p {
      color: #555;
    }
    .price {
      color: #b88a44;
      font-weight: bold;
      font-size: 22px;
    }
    button {
      background: #222;
      color: #fff;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <div class="checkout-box">
    <img src="https://the-outfits.vercel.app/logo.png" alt="The Outfits Logo" />
    <h2>Checkout</h2>
    <h3 id="product-name">Product Name</h3>
    <p class="price" id="product-price">₹0</p>
    <button id="pay-now">Pay Now</button>
    <p style="margin-top: 15px; color: #666; font-size: 14px;">
      Clicking pay will open Razorpay checkout (demo key).<br>
      After approval, we will replace with real key.
    </p>
  </div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    // Get name and price from URL
    const params = new URLSearchParams(window.location.search);
    const name = params.get('name') || 'Sample Product';
    const price = params.get('price') || '999';
    
    document.getElementById('product-name').textContent = name;
    document.getElementById('product-price').textContent = `₹${price}`;

    document.getElementById('pay-now').addEventListener('click', function() {
      const options = {
        key: "rzp_test_1234567890abcd", // demo key (replace later)
        amount: price * 100,
        currency: "INR",
        name: "The Outfits",
        description: name,
        image: "https://the-outfits.vercel.app/logo.png",
        handler: function () {
          alert("Payment Successful (Demo Mode)");
        },
        theme: { color: "#b88a44" }
      };
      const rzp = new Razorpay(options);
      rzp.open();
    });
  </script>
</body>
</html>
