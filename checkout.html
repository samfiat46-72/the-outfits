<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - The Outfits</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      color: #222;
    }

    .navbar {
      background-color: #000;
      padding: 10px 0;
      text-align: center;
    }
    .navbar ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .navbar li {
      display: inline-block;
      margin: 0 15px;
    }
    .navbar a {
      color: gold;
      font-weight: bold;
      text-decoration: none;
      font-size: 16px;
    }

    .checkout-box {
      width: 90%;
      max-width: 450px;
      margin: 30px auto;
      padding: 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .product-img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    button {
      background-color: black;
      color: gold;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="privacy.html">Privacy Policy</a></li>
      <li><a href="refunds.html">Refund & Cancellation</a></li>
      <li><a href="terms.html">Terms & Conditions</a></li>
      <li><a href="shipping.html">Shipping Policy</a></li>
    </ul>
  </nav>

  <div class="checkout-box">
    <h2>Checkout</h2>

    <img id="productImage" class="product-img" src="" alt="Product">

    <h3 id="productName"></h3>
    <p><strong>Price:</strong> ₹<span id="productPrice"></span></p>

    <button onclick="payNow()">Pay Now</button>
  </div>

  <!-- Razorpay Script -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script>
    // Get product details from URL
    const urlParams = new URLSearchParams(window.location.search);
    const productName = urlParams.get("name");
    const productPrice = urlParams.get("price");
    const productImage = urlParams.get("img");

    document.getElementById("productName").innerText = productName;
    document.getElementById("productPrice").innerText = productPrice;
    document.getElementById("productImage").src = productImage;

    function payNow() {
      var options = {
        key: "rzp_live_RiXHePk5XFtAha", 
        amount: productPrice * 100,
        currency: "INR",
        name: "The Outfits",
        description: productName,
        image: "https://raw.githubusercontent.com/samfiat46-72/the-outfits/main/1logo.png",

        handler: function (response) {
          window.location.href = "thankyou.html";
        }
      };

      var rzp = new Razorpay(options);
      rzp.open();
    }
  </script>

</body>
</html>
