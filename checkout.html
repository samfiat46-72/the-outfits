<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — The Outfits</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #faf4ec;
      color: #2b2b2b;
      text-align: center;
      margin: 0;
      padding: 40px 20px;
    }
    .checkout-container {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      max-width: 360px;
      margin: 40px auto;
    }
    img.logo {
      width: 120px;
      margin-bottom: 15px;
    }
    img.product {
      width: 180px;
      height: auto;
      border-radius: 12px;
      margin: 10px 0;
      object-fit: cover;
    }
    h1 {
      font-size: 1.6rem;
      margin: 10px 0;
    }
    .price {
      font-size: 1.4rem;
      color: #c5a04f;
      margin: 10px 0;
      font-weight: 600;
    }
    button {
      background-color: #2b2b2b;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover {
      background-color: #c5a04f;
      color: #fff;
    }
    p.note {
      font-size: 0.8rem;
      color: #6f6f6f;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="checkout-container">
    <img src="file_00000000238c61fa93487af7dd1843c3.png" alt="The Outfits Logo" class="logo">
    <h1>Checkout</h1>
    <img id="product-img" src="" alt="Product Image" class="product">
    <h3 id="product-name">Sample Product</h3>
    <p class="price" id="product-price">₹999</p>
    <button id="pay-now">Pay Now</button>
    <p class="note">Clicking pay will open Razorpay checkout (demo key). After approval, we will replace with real key.</p>
  </div>

  <script>
    // Get query parameters from URL
    const urlParams = new URLSearchParams(window.location.search);
    const name = urlParams.get('name') || 'Sample Product';
    const price = urlParams.get('price') || '999';
    const image = urlParams.get('image') || 'https://images.pexels.com/photos/2635315/pexels-photo-2635315.jpeg';

    // Apply values dynamically
    document.getElementById('product-name').textContent = name;
    document.getElementById('product-price').textContent = `₹${price}`;
    document.getElementById('product-img').src = image;

    // Razorpay demo button (no change)
    document.getElementById('pay-now').addEventListener('click', () => {
      alert(`Proceeding to pay ₹${price} for ${name}`);
    });
  </script>
</body>
</html>
