<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — The Outfits</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #f9f1e7;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .checkout-card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      width: 320px;
    }

    .checkout-card img {
      width: 200px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .checkout-card h2 {
      margin-bottom: 10px;
    }

    .checkout-card h3 {
      margin: 10px 0;
    }

    .price {
      color: #c49b63;
      font-weight: 600;
      font-size: 18px;
      margin: 10px 0;
    }

    button {
      background-color: #333;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background-color: #555;
    }

    p.note {
      font-size: 12px;
      color: gray;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="checkout-card">
    <img src="images/logo.png" alt="The Outfits Logo" style="width:120px; margin-bottom:20px;">

    <h2>Checkout</h2>

    <img id="product-image" alt="Product Image">

    <h3 id="product-name">Sample Product</h3>
    <p class="price" id="product-price">₹999</p>

    <button id="rzp-button1">Pay Now</button>
    <p class="note">Clicking pay will open Razorpay checkout (demo key). After approval, we will replace with real key.</p>
  </div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    // Get parameters from URL
    const params = new URLSearchParams(window.location.search);
    const productName = params.get("name") || "Sample Product";
    const productPrice = params.get("price") || "999";
    const productImg = params.get("img");

    // Update product details
    document.getElementById("product-name").textContent = productName;
    document.getElementById("product-price").textContent = "₹" + productPrice;
    if (productImg) document.getElementById("product-image").src = productImg;

    // Razorpay test integration
    const options = {
      key: "rzp_test_demoKey123", // Demo key
      amount: productPrice * 100,
      currency: "INR",
      name: "The Outfits",
      description: productName,
      image: "images/logo.png",
      handler: function (response) {
        alert("Payment Successful! Payment ID: " + response.razorpay_payment_id);
      },
      theme: {
        color: "#c49b63",
      },
    };

    const rzp1 = new Razorpay(options);
    document.getElementById("rzp-button1").onclick = function (e) {
      rzp1.open();
      e.preventDefault();
    };
  </script>
</body>
</html>
